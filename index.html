<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202b29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Gather your company. Take the long road. An offline mercenary adventure.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./src/style.css">
  <title>Ashen Company</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Ashen Company home"><img src="./assets/world/banner_101.png" alt=""><span>Ashen Company<small>THE GREY MARCHES</small></span></a>
    <div id="resources" class="resources" aria-label="Company resources"></div>
    <button id="settings-button" class="small" aria-label="Save and offline settings">Save / Menu</button>
  </header>
  <nav class="main-nav" aria-label="Main navigation">
    <div class="nav-tabs"><button data-tab="world" class="active">World map</button><button data-tab="company">Company & equipment</button><button data-tab="journal">Chronicle</button></div>
    <span id="offline-status" class="offline-status">Preparing offline…</span>
  </nav>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
